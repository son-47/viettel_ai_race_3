# Candidate only. Build/push, pin the registry digest, run the GPU smoke test,
# then use the paired same-image A/B before spending a portal submission.
services:
  model:
    image: misokaio/ghfjdk:v0.25.1-lfm25-rmsnorm-fp8
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_USE_FASTOKENS=1
      - VLLM_CONFIGURE_LOGGING=0
      - VLLM_LFM25_FUSED_SHORTCONV=1
      - VLLM_LFM25_BYPASS_SINGLE_VSTACK=1
      - VLLM_LFM25_FUSED_QK_NORM_ROPE=1
      - VLLM_LFM25_FUSED_SILU_FP8=1
      - VLLM_LFM25_FUSED_RMSNORM_FP8=1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model
      - --quantization=fp8
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --optimization-level=3
      - --gpu-memory-utilization=0.85
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --max-model-len=8192
      - --max-num-batched-tokens=4096
      - --max-num-seqs=32
      - --disable-uvicorn-access-log
      - --language-model-only
      - --skip-mm-profiling
      - --no-enable-log-requests
      - --disable-log-stats
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
