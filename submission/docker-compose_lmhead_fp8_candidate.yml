services:
  model:
    image: misokaio/ghfjdk@sha256:2be86725b37a2853d601a7acd55d3fb37906d50ef787a0b7367761fe8e27647e
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_USE_FASTOKENS=1
      - VLLM_CONFIGURE_LOGGING=0
      - VLLM_LFM25_FUSED_SHORTCONV=1
      - VLLM_LFM25_BYPASS_SINGLE_VSTACK=1
      - VLLM_LFM25_FUSED_QK_NORM_ROPE=1
      - VLLM_LFM25_FUSED_SILU_FP8=1
      - VLLM_LFM25_FP8_LM_HEAD=1
      - VLLM_LFM25_FP8_LM_HEAD_REQUIRE_CUTLASS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=/model
      - --quantization=fp8
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --optimization-level=3
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --async-scheduling
      - --override-generation-config
      - '{"temperature": 0.0}'
      - --max-model-len=8192
      - --max-num-batched-tokens=4096
      - --max-num-seqs=32
      - --disable-uvicorn-access-log
      - --language-model-only
      - --skip-mm-profiling
      - --no-enable-log-requests
      - --disable-log-stats
    ports:
      - "8000:8000"
    ipc: "host"
    shm_size: "8g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
