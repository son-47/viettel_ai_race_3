# Speculative-decoding candidate.
# The portal supplies the required target checkpoint at /model.  The public
# image contains LiquidAI/LFM2.5-350M at /draft-model and the vLLM hybrid
# draft-model fixes tracked in vllm-project/vllm#49112.
# Điểm
# 34.9000
# Đã chấm 40 phút trước

# Chỉ số

# ers
# 34.9
# f_delta
# 1
# penalty
# 1
# final_score
# 34.9
# total_count
# 420
# ttft_p50_ms
# 67
# ttft_p95_ms
# 126
# failed_count
# 6
# warmup_count
# 0
# accuracy_drop
