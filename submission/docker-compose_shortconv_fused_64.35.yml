services:
  model:
    # Candidate only: submit after paired H200/L4 A/B beats both image controls.
    image: misokaio/ghfjdk:v0.25.1-lfm25-fused@sha256:53d1892ca842ffa2f5e3113f0f775450701bacb7c014d8f497bd63e6ad61d401
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_USE_FASTOKENS=1
      - VLLM_CONFIGURE_LOGGING=0
      - VLLM_LFM25_FUSED_SHORTCONV=1
      - VLLM_LFM25_BYPASS_SINGLE_VSTACK=1
      - VLLM_LFM25_FUSED_QK_NORM_ROPE=1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model
      - --quantization=fp8
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --optimization-level=3
      - --gpu-memory-utilization=0.85
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --performance-mode=interactivity
      - --disable-uvicorn-access-log
      - --language-model-only
      - --skip-mm-profiling
      - --no-enable-log-requests
      - --disable-log-stats
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
